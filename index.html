<script>
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('s');
function el(tag,a={},p=svg){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}
function set(e,a){for(const k in a){let v=a[k];if(k==='r'&&v<0)v=0;e.setAttribute(k,v);}}
const C={navy:'#14284b',deep:'#0b1a33',mid:'#21406e',teal:'#1aa6a0',tealL:'#7fd6cf',yel:'#f2b705',red:'#e2413b',snow:'#f3f6fa',shade:'#d6e1ec',green:'#34c26b',skin:'#f2c9a0'};
const RISK=['#34c26b','#9cc93a','#f2b705','#f27a24','#e2413b'];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{if(x<=0)return 0;if(x>=1)return 1;const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
function mix(a,b,t){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);const r=Math.round(lerp(A>>16,B>>16,t)),g=Math.round(lerp(A>>8&255,B>>8&255,t)),bl=Math.round(lerp(A&255,B&255,t));return '#'+((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1);}
function sample(p,n=300){const L=p.getTotalLength(),pts=[];for(let i=0;i<=n;i++){const q=p.getPointAtLength(L*i/n);pts.push([q.x,q.y]);}
  return{L,at(s){s=clamp(s);const f=s*n,i=Math.floor(f),k=Math.min(n,i+1),r=f-i;return[lerp(pts[i][0],pts[k][0],r),lerp(pts[i][1],pts[k][1],r)];},
  ang(s){const a=this.at(s-.01),b=this.at(s+.01);return Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;}};}

const defs=el('defs');
defs.innerHTML=`
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
<linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1a33"/><stop offset="1" stop-color="#2d5480"/></linearGradient>
<linearGradient id="sky4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14284b"/><stop offset="1" stop-color="#1f4470"/></linearGradient>
<linearGradient id="sky5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86c9cf"/><stop offset="1" stop-color="#e8f4f6"/></linearGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#f2b705" stop-opacity=".55"/><stop offset="1" stop-color="#f2b705" stop-opacity="0"/></radialGradient>
<radialGradient id="tealHalo"><stop offset="0" stop-color="#1aa6a0" stop-opacity=".55"/><stop offset="1" stop-color="#1aa6a0" stop-opacity="0"/></radialGradient>
<radialGradient id="warm"><stop offset="0" stop-color="#fff3c4" stop-opacity=".9"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></radialGradient>
<linearGradient id="greenCone" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#34c26b" stop-opacity=".6"/><stop offset="1" stop-color="#34c26b" stop-opacity="0"/></linearGradient>
<linearGradient id="scanCone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd6cf" stop-opacity=".05"/><stop offset="1" stop-color="#7fd6cf" stop-opacity=".35"/></linearGradient>
<clipPath id="mapclip"><path d="M520 300 L760 215 L990 250 L1190 195 L1410 300 L1490 470 L1430 650 L1300 770 L1120 905 L900 945 L700 880 L560 760 L465 600 L440 440 Z"/></clipPath>
<clipPath id="screenclip"><rect x="-205" y="-405" width="410" height="810" rx="40"/></clipPath>
<clipPath id="frame"><rect width="1920" height="1080"/></clipPath>`;

const root=el('g',{'clip-path':'url(#frame)'});

function tree(p,x,y,s,col=C.teal){const t=el('g',{transform:`translate(${x} ${y}) scale(${s})`},p);
  el('rect',{x:-11,y:-46,width:22,height:56,fill:C.navy},t);
  [[ -40,120],[-120,96],[-190,70]].forEach(([yy,w])=>{
    el('path',{d:`M${-w} ${yy} L0 ${yy-120} L${w} ${yy}Z`,fill:col},t);
    const f=.42;el('path',{d:`M${-w*f} ${yy-120*(1-f)} L0 ${yy-120} L${w*f} ${yy-120*(1-f)} L${w*f*.45} ${yy-120*(1-f)+10} L0 ${yy-120*(1-f)-2} L${-w*f*.45} ${yy-120*(1-f)+10}Z`,fill:C.snow},t);
  });return t;}

/* ---------------- Scene 1: snowy park, pole camera detects bird ---------------- */
function scene1(g){
  const W=el('g',{},g);
  el('rect',{width:1920,height:1080,fill:'url(#sky1)'},W);
  el('circle',{cx:300,cy:170,r:64,fill:C.snow,opacity:.14},W);
  const city=el('g',{opacity:.55},W);
  for(let i=0;i<17;i++){const w=70+((i*37)%60),h=90+((i*53)%170),x=i*120-30;
    el('rect',{x,y:690-h,width:w,height:h+40,fill:'#2b507b'},city);
    for(let r=0;r<Math.floor(h/42);r++)if((i+r)%3==0)el('rect',{x:x+14,y:690-h+16+r*42,width:14,height:12,fill:C.yel,opacity:.45},city);}
  el('path',{d:'M0 720 Q 320 650 680 700 T 1340 690 T 1920 680 V1080 H0Z',fill:'#c3d3e3'},W);
  el('path',{d:'M0 762 Q 480 738 960 752 T 1920 746 V1080 H0Z',fill:C.snow},W);
  tree(W,180,766,.42);tree(W,300,760,.34,'#168f8a');tree(W,470,756,.3);tree(W,1560,756,.36,'#168f8a');tree(W,1720,760,.42);
  // river
  el('path',{d:'M0 790 Q 500 772 960 786 T 1920 780 L1920 862 Q 1400 874 960 858 T 0 868 Z',fill:'#1d6f84'},W);
  el('path',{d:'M0 790 Q 500 772 960 786 T 1920 780',stroke:'#cfe0ea','stroke-width':6,fill:'none'},W);
  const rip=[[815,'M60 815 L300 812 M520 818 L760 821 M1100 816 L1380 812 M1600 818 L1840 814'],[838,'M180 840 L460 836 M820 842 L1060 838 M1300 840 L1560 844']].map(([y,d])=>el('path',{d,stroke:C.tealL,'stroke-width':4,'stroke-linecap':'round','stroke-dasharray':'60 40',opacity:.6,fill:'none'},W));
  [[420,826,40],[1180,820,30],[1500,842,46]].forEach(([x,y,r])=>el('ellipse',{cx:x,cy:y,rx:r,ry:7,fill:'#e7f0f5'},W));
  // near bank (河川敷)
  el('path',{d:'M0 860 Q 480 846 960 862 T 1920 854 V1080 H0Z',fill:C.snow},W);
  el('path',{d:'M0 870 Q 480 856 960 872 T 1920 864',stroke:C.shade,'stroke-width':8,fill:'none'},W);
  el('path',{d:'M0 1010 Q 600 985 1200 1010 T 1920 1000',stroke:C.shade,'stroke-width':10,fill:'none'},W);
  [[120,880],[330,890],[560,884],[1060,890],[1240,880],[1600,886],[1760,880]].forEach(([x,y])=>{for(let k=0;k<5;k++)el('path',{d:`M${x+k*9} ${y+40} Q ${x+k*9-6} ${y+10} ${x+k*9+(k-2)*7} ${y-18-k%2*14}`,stroke:'#b89a5a','stroke-width':3.5,fill:'none','stroke-linecap':'round'},W);el('ellipse',{cx:x+18,cy:y+40,rx:34,ry:8,fill:C.snow},W);});
  for(let i=0;i<8;i++)el('ellipse',{cx:220+i*58,cy:990-i*5+(i%2)*14,rx:11,ry:6,fill:C.shade},W);
  // pole + wires
  el('path',{d:'M0 240 Q 700 310 1330 180',stroke:'#0b1a33','stroke-width':3,fill:'none'},W);
  el('path',{d:'M1490 180 Q 1720 236 1920 226',stroke:'#0b1a33','stroke-width':3,fill:'none'},W);
  el('rect',{x:1394,y:120,width:28,height:840,fill:C.navy},W);el('ellipse',{cx:1408,cy:962,rx:46,ry:10,fill:C.shade},W);
  el('rect',{x:1318,y:168,width:180,height:16,rx:3,fill:C.navy},W);
  el('rect',{x:1316,y:160,width:184,height:9,rx:4,fill:C.snow},W);
  [1334,1482].forEach(x=>el('circle',{cx:x,cy:176,r:8,fill:C.tealL},W));
  el('rect',{x:1390,y:112,width:36,height:12,rx:6,fill:C.snow},W);
  el('rect',{x:1380,y:422,width:20,height:22,fill:C.navy},W);
  // camera
  const cam=el('g',{},W);
  el('rect',{x:-120,y:-28,width:120,height:56,rx:14,fill:C.yel},cam);
  el('rect',{x:-128,y:-38,width:128,height:16,rx:8,fill:C.navy},cam);
  el('rect',{x:-124,y:-44,width:120,height:8,rx:4,fill:C.snow},cam);
  el('circle',{cx:-120,cy:0,r:22,fill:C.navy},cam);
  el('circle',{cx:-120,cy:0,r:12,fill:C.teal},cam);
  el('circle',{cx:-124,cy:-4,r:4,fill:'#fff'},cam);
  const led=el('circle',{cx:-18,cy:-12,r:5,fill:C.red},cam);
  const CX=1394,CY=433;
  const cone=el('polygon',{fill:'url(#scanCone)'},W);
  const coneL=el('path',{stroke:C.tealL,'stroke-width':2,fill:'none',opacity:.6,'stroke-dasharray':'6 8'},W);
  W.appendChild(cam);
  // bird lying in snow
  const BX=760,BY=935;
  const bird=el('g',{transform:`translate(${BX} ${BY})`},W);
  el('ellipse',{cx:0,cy:24,rx:88,ry:12,fill:C.shade},bird);
  const bb=el('g',{transform:'rotate(-8)'},bird);
  el('path',{d:'M40 -2 L94 -16 L90 8 Z',fill:'#4a5d7a'},bb);
  el('ellipse',{cx:5,cy:0,rx:55,ry:27,fill:'#6f84a3'},bb);
  el('ellipse',{cx:2,cy:10,rx:42,ry:15,fill:'#eef2f6'},bb);
  el('path',{d:'M-10 -10 Q 25 -32 54 -6 Q 20 2 -10 -10Z',fill:'#50637f'},bb);
  el('circle',{cx:-52,cy:-4,r:23,fill:'#6f84a3'},bb);
  el('path',{d:'M-74 -5 L-96 2 L-74 8Z',fill:C.yel},bb);
  el('path',{d:'M-62 -9 Q-56 -3 -50 -9',stroke:C.navy,'stroke-width':3,fill:'none','stroke-linecap':'round'},bb);
  el('path',{d:'M6 26 L12 44 M20 24 L28 41',stroke:'#d98b2b','stroke-width':4,'stroke-linecap':'round'},bb);
  el('path',{d:'M-30 26 Q 0 18 40 27 Q 10 34 -30 26Z',fill:C.snow},bird);
  // detection box
  const det=el('g',{opacity:0},W);
  const box=el('rect',{x:-125,y:-82,width:250,height:140,rx:8,fill:C.red,'fill-opacity':.07,stroke:C.red,'stroke-width':6,'stroke-dasharray':'22 14'},det);
  const pulse=el('rect',{x:-125,y:-82,width:250,height:140,rx:8,fill:'none',stroke:C.red,'stroke-width':3},det);
  [[-125,-82,1,1],[125,-82,-1,1],[-125,58,1,-1],[125,58,-1,-1]].forEach(([x,y,sx,sy])=>el('path',{d:`M${x} ${y+sy*34} L${x} ${y} L${x+sx*34} ${y}`,stroke:C.red,'stroke-width':10,fill:'none','stroke-linecap':'round'},det));
  const ping=el('g',{opacity:0},W);
  el('circle',{cx:0,cy:0,r:26,fill:C.red},ping);
  el('rect',{x:-4,y:-14,width:8,height:17,rx:4,fill:'#fff'},ping);el('circle',{cx:0,cy:10,r:4.5,fill:'#fff'},ping);
  return t=>{
    const cx=t<1.8?lerp(1180,380,eio(seg(t,.2,1.8))):lerp(380,BX,eio(seg(t,1.8,3)));
    const dx=cx-CX,dy=940-CY,a=Math.atan2(-dy,-dx);
    set(cam,{transform:`translate(${CX} ${CY}) rotate(${a*180/Math.PI})`});
    const lx=CX-120*Math.cos(a),ly=CY-120*Math.sin(a);
    const w=t<3?120:lerp(120,90,seg(t,3,3.5));
    set(cone,{points:`${lx},${ly} ${cx-w},${965} ${cx+w},${965}`,opacity:1-seg(t,4.2,5.5)*.6});
    set(coneL,{d:`M${lx} ${ly} L${cx-w} 965 M${lx} ${ly} L${cx+w} 965`,opacity:.6-seg(t,4.2,5.5)*.4});
    rip.forEach((r,i)=>set(r,{'stroke-dashoffset':-t*(40+i*15)}));
    const found=t>3.1;
    set(led,{opacity:found?(Math.sin(t*18)>0?1:.2):(Math.sin(t*4)>0?1:.35)});
    const p=seg(t,3.1,3.6);
    set(det,{opacity:p,transform:`translate(${BX} ${BY}) scale(${lerp(1.6,1,back(p))})`});
    set(box,{'stroke-dashoffset':-t*50});
    const q=((t-3.6)%1.1)/1.1;set(pulse,{opacity:t>3.6?(1-q)*.8:0,transform:`scale(${1+q*.35})`});
    const pp=seg(t,3.7,4.1);set(ping,{opacity:pp,transform:`translate(${BX+150} ${BY-110}) scale(${back(pp)})`});
    const s=1+.2*eio(seg(t,3.4,7.3));
    set(W,{transform:`translate(${BX} ${BY-60}) scale(${s}) translate(${-BX} ${-(BY-60)})`});
  };
}

/* ---------------- Scene 2: edge AI recognises on-camera, sends ONE alert packet ---------------- */
function birdGlyph(p,s=1,col='#fff'){const b=el('g',{transform:`scale(${s})`},p);
  el('ellipse',{cx:2,cy:2,rx:13,ry:8,fill:col},b);el('circle',{cx:-10,cy:-3,r:6.5,fill:col},b);el('path',{d:'M-16 -3 L-23 0 L-16 2Z',fill:col},b);el('path',{d:'M12 0 L22 -5 L20 6Z',fill:col},b);return b;}
function chip(p,x,y,s=1){const c=el('g',{transform:`translate(${x} ${y}) scale(${s})`},p);
  for(let k=-1;k<=1;k++){[[-30,k*10,-22,k*10],[22,k*10,30,k*10],[k*10,-30,k*10,-22],[k*10,22,k*10,30]].forEach(([a,b,c2,d])=>el('line',{x1:a,y1:b,x2:c2,y2:d,stroke:C.tealL,'stroke-width':4,'stroke-linecap':'round'},c));}
  const body=el('rect',{x:-22,y:-22,width:44,height:44,rx:8,fill:C.navy,stroke:C.tealL,'stroke-width':4},c);
  const core=el('rect',{x:-10,y:-10,width:20,height:20,rx:4,fill:C.tealL},c);return{c,body,core};}
function scene2(g){
  el('rect',{width:1920,height:1080,fill:C.deep},g);
  for(let i=0;i<46;i++)el('circle',{cx:(i*397)%1920,cy:(i*131)%640,r:2,fill:'#fff',opacity:.14},g);
  el('rect',{x:0,y:800,width:1920,height:280,fill:'#0f2444'},g);
  el('rect',{x:0,y:788,width:1920,height:18,fill:C.snow},g);
  const pole=(x,h,s,op)=>{const p=el('g',{transform:`translate(${x} 790) scale(${s})`,opacity:op},g);
    el('rect',{x:-12,y:-h,width:24,height:h,fill:'#2a4a76'},p);el('rect',{x:-70,y:-h+30,width:140,height:12,fill:'#2a4a76'},p);
    el('rect',{x:-72,y:-h+24,width:144,height:7,rx:3,fill:C.snow},p);
    el('rect',{x:12,y:-h*.6-22,width:72,height:42,rx:11,fill:C.yel},p);el('circle',{cx:84,cy:-h*.6-1,r:14,fill:C.navy},p);el('circle',{cx:84,cy:-h*.6-1,r:7,fill:C.tealL},p);return p;};
  pole(860,420,.6,.4);pole(1100,380,.5,.3);
  pole(300,600,1,1);
  // telecom building
  const halo=el('circle',{cx:1550,cy:520,r:200,fill:'url(#halo)',opacity:0},g);
  const bld=el('g',{},g);
  el('rect',{x:1545,y:80,width:10,height:150,fill:'#35588a'},bld);
  const beacon=el('circle',{cx:1550,cy:78,r:9,fill:C.red},bld);
  el('rect',{x:1440,y:226,width:220,height:84,fill:'#2a4c7c'},bld);
  el('rect',{x:1436,y:218,width:228,height:12,rx:6,fill:C.snow},bld);
  el('rect',{x:1380,y:300,width:340,height:500,fill:C.mid},bld);
  el('rect',{x:1376,y:292,width:348,height:13,rx:6,fill:C.snow},bld);
  const wins=[];for(let r=0;r<8;r++)for(let c=0;c<5;c++)wins.push(el('rect',{x:1405+c*62,y:330+r*56,width:36,height:30,rx:4,fill:(r*5+c)%7==0?'#3d5f8f':'#173462'},bld));
  el('rect',{x:1510,y:720,width:80,height:80,fill:'#173462'},bld);
  const up=[0,1,2].map(()=>el('path',{fill:'none',stroke:C.red,'stroke-width':5,'stroke-linecap':'round',opacity:0},g));
  // fibres (quiet until detection)
  const P=['M300 470 L300 930 Q300 960 330 960 L1400 960 Q1440 960 1440 920 L1440 800','M-20 1018 L1450 1018 Q1500 1018 1500 970 L1500 800','M1940 990 L1620 990 Q1570 990 1570 950 L1570 800'];
  let main;
  P.forEach((d,i)=>{el('path',{d,stroke:'#081428','stroke-width':i?18:22,fill:'none','stroke-linejoin':'round'},g);
    const l=el('path',{d,stroke:'#1d4673','stroke-width':i?8:10,fill:'none','stroke-linejoin':'round'},g);if(!i)main=l;});
  const S=sample(main);
  const lit=el('path',{d:P[0],stroke:C.red,'stroke-width':4,fill:'none','stroke-linejoin':'round','stroke-dasharray':S.L,'stroke-dashoffset':S.L,opacity:.8},g);
  // edge AI chip on camera
  const ch=chip(g,345,360,.85);
  const proc=el('circle',{cx:345,cy:360,r:30,fill:'none',stroke:C.tealL,'stroke-width':3,opacity:0},g);
  // camera-view bubble
  const inset=el('g',{opacity:0},g);
  el('path',{d:'M-120 104 L-206 214 L-70 104Z',fill:'#0f2444',stroke:C.tealL,'stroke-width':3,'stroke-linejoin':'round'},inset);
  el('rect',{x:-180,y:-120,width:360,height:226,rx:26,fill:'#0f2444',stroke:C.tealL,'stroke-width':3},inset);
  el('rect',{x:-118,y:101,width:44,height:8,fill:'#0f2444'},inset);
  el('rect',{x:-160,y:-100,width:320,height:186,rx:14,fill:'#2b5078'},inset);
  el('path',{d:'M-160 20 Q 0 -4 160 14 L160 72 Q160 86 146 86 L-146 86 Q-160 86 -160 72Z',fill:C.snow},inset);
  el('path',{d:'M-160 -6 Q 0 -24 160 -10 L160 12 Q 0 -6 -160 16Z',fill:'#1d6f84'},inset);
  const mb=el('g',{transform:'translate(0 50)'},inset);
  el('ellipse',{cx:4,cy:0,rx:34,ry:16,fill:'#6f84a3'},mb);el('ellipse',{cx:2,cy:6,rx:24,ry:8,fill:'#eef2f6'},mb);
  el('circle',{cx:-32,cy:-3,r:14,fill:'#6f84a3'},mb);el('path',{d:'M-45 -4 L-58 0 L-45 3Z',fill:C.yel},mb);
  const scan=el('rect',{x:-160,y:-100,width:6,height:186,fill:C.tealL,opacity:0},inset);
  const ibox=el('rect',{x:-66,y:14,width:132,height:66,rx:6,fill:'none',stroke:C.red,'stroke-width':5,'stroke-dasharray':'14 9',opacity:0},inset);

  el('ellipse',{cx:1606,cy:502,rx:56,ry:62,fill:C.skin},cu);
  el('path',{d:'M1550 502 Q 1544 436 1612 434 Q 1670 436 1668 490 Q 1640 466 1612 470 Q 1596 484 1572 476 Q 1558 488 1550 502Z',fill:C.navy},cu);
  el('ellipse',{cx:1578,cy:530,rx:10,ry:6,fill:C.red,opacity:.25},cu);el('ellipse',{cx:1632,cy:530,rx:9,ry:6,fill:C.red,opacity:.25},cu);
  el('path',{d:'M1575 490 Q 1584 485 1594 489 M1617 489 Q 1627 485 1637 490',stroke:C.navy,'stroke-width':3.5,fill:'none','stroke-linecap':'round'},cu);
  const eyeO=el('g',{},cu);[[1584,508],[1626,508]].forEach(([x,y])=>{el('ellipse',{cx:x,cy:y,rx:5.5,ry:7.5,fill:C.navy},eyeO);el('circle',{cx:x+1.5,cy:y-3,r:2,fill:'#fff'},eyeO);});
  const eyeH=el('path',{d:'M1577 510 Q1584 500 1591 510 M1619 510 Q1626 500 1633 510',stroke:C.navy,'stroke-width':4,fill:'none','stroke-linecap':'round',opacity:0},cu);
  el('path',{d:'M1601 512 Q 1593 524 1601 527',stroke:'#d39a74','stroke-width':3.5,fill:'none','stroke-linecap':'round'},cu);
  const smile=el('path',{stroke:'#a8563f','stroke-width':4,'stroke-linecap':'round','stroke-linejoin':'round'},cu);
  const arm=el('path',{stroke:C.red,'stroke-width':42,fill:'none','stroke-linecap':'round'},g);
  const hand=el('circle',{r:22,fill:C.skin},g);
  const spark=[[1240,420],[1330,560],[1500,610],[1180,760],[1460,470]].map(([x,y])=>({x,y,e:el('path',{d:'M0 -22 Q4 -4 22 0 Q4 4 0 22 Q-4 4 -22 0 Q-4 -4 0 -22Z',fill:C.yel},g)}));
  const sh=[1580,620],grab=[1272,560],held=[1515,650];
  return t=>{
    let hx,hy,cx,cy;
    if(t<2.1){const p=eio(seg(t,.8,2.1));hx=lerp(1560,grab[0],p);hy=lerp(720,grab[1],p);cx=1268;cy=608-31;}
    else{const p=eio(seg(t,2.4,3.6));hx=lerp(grab[0],held[0],p);hy=lerp(grab[1],held[1],p)-Math.sin(p*Math.PI)*40;cx=hx-4;cy=hy+18;}
    const ex=(sh[0]+hx)/2,ey=Math.max(sh[1],hy)+60;
    set(arm,{d:`M${sh[0]} ${sh[1]} Q ${ex} ${ey} ${hx} ${hy}`});
    set(hand,{cx:hx,cy:hy});
    set(pick,{transform:`translate(${cx} ${cy}) rotate(${t>2.1?-6*Math.sin(seg(t,2.4,3.6)*Math.PI):0})`});
    const happy=t>2.4;
    set(smile,{d:happy?'M1590 537 Q1604 554 1618 537 Z':'M1593 540 Q1604 546 1615 540',fill:happy?'#c5332e':'none'});
    set(eyeO,{opacity:happy?0:1});set(eyeH,{opacity:happy?1:0});
    spark.forEach((s,i)=>{const q=((t-3.2)*.9+i*.21)%1;const a=t>3.2?Math.sin(q*Math.PI):0;
      set(s.e,{transform:`translate(${s.x} ${s.y}) scale(${a}) rotate(${t*40})`,opacity:a});});
  };
}

const scenes=[{d:7.3,f:scene1,snow:1},{d:6.4,f:scene2,snow:.5},{d:9.6,f:scene3,snow:0},{d:6.8,f:scene3b,snow:0},{d:8.4,f:scene5,snow:.8},{d:7,f:scene6,snow:0}];
let TOTAL=0;scenes.forEach(s=>{s.start=TOTAL;TOTAL+=s.d;s.g=el('g',{},root);s.u=s.f(s.g);});
const FADE=.8;
// global snowfall
const snowG=el('g',{},root);
const flakes=[];for(let i=0;i<140;i++){const r=2+Math.random()*5;flakes.push({x:Math.random()*1920,y:Math.random()*1080,r,v:40+r*18,ph:Math.random()*6,e:el('circle',{r,fill:'#fff',opacity:.55+Math.random()*.4},snowG)});}

let clock=0,last=performance.now(),paused=false;
const bar=document.getElementById('bar');
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)clock+=dt;
  draw();requestAnimationFrame(frame);
}
function draw(){
  const t=clock%TOTAL;let amt=0;
  scenes.forEach((s,i)=>{const lt=t-s.start;const vis=lt>=0&&lt<s.d+(i<scenes.length-1?FADE:0);
    if(!vis){s.g.style.display='none';return;}
    s.g.style.display='';let o=seg(lt,0,FADE);if(i==scenes.length-1)o*=1-seg(lt,s.d-FADE,s.d);
    s.g.setAttribute('opacity',o);s.u(lt);amt=amt*(1-o)+s.snow*o;});
  flakes.forEach(f=>set(f.e,{cx:f.x+Math.sin(clock*1.3+f.ph)*14,cy:((f.y+f.v*clock)%1100)-10}));
  snowG.setAttribute('opacity',amt);
  bar.style.width=(t/TOTAL*100)+'%';
}
requestAnimationFrame(frame);
document.getElementById('wrap').addEventListener('click',()=>paused=!paused);
addEventListener('keydown',e=>{if(e.code==='Space'){paused=!paused;e.preventDefault();}
  const k=parseInt(e.key);if(k>=1&&k<=scenes.length)clock=scenes[k-1].start+.01;
  if(e.key==='ArrowRight')clock+=1;if(e.key==='ArrowLeft')clock=Math.max(0,clock-1);});
window.__seek=(s)=>{clock=s;};window.__render=(s)=>{paused=true;clock=s;draw();};window.__total=TOTAL;window.__pause=(p)=>{paused=p;};
</script>
